services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qanc-backend
    container_name: qanc-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
